<meta charset="utf-8">
<title>Rio IA by SOLVAM</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  /* Layout: una pantalla vertical. Capa 1 = video a pantalla completa con WhatsApp siempre a la vista.
     Capa 2 = pantalla final (Rio IA, Soluções não problemas, FALE CONOSCO) que entra al terminar el video. */
  :root {
    --navy: #14384f;
    --navy-deep: #0b2233;
    --sand: #f5ece0;
    --panel: #325169;
    --orange: #f58a1f;
    --orange-press: #d9740f;
    --wa-ink: #1a1206;
    --display: "Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--navy-deep);
    color: var(--sand);
    font-family: var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    position: relative;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 18px;
    background: var(--navy-deep);
  }
  #app { height: 100dvh; }
  @media (max-width: 520px) {
    body { padding-left: 0; padding-right: 0; }
    #app { max-width: none; border-radius: 0; }
  }
  .layer { position: absolute; inset: 0; }

  /* ---------- Capa 1: video ---------- */
  #video { width: 100%; height: 100%; object-fit: cover; display: block; background: var(--navy-deep); }
  .scrim {
    position: absolute; left: 0; right: 0; bottom: 0; height: 34%;
    background: linear-gradient(to top, rgba(11,34,51,.82), rgba(11,34,51,0));
    pointer-events: none;
  }
  .brand-tag {
    position: absolute; top: 14px; left: 14px;
    display: flex; align-items: center; gap: 8px;
    font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .02em;
    color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.55);
  }
  .brand-tag small { display: block; font-weight: 500; font-size: 10px; opacity: .85; letter-spacing: .06em; }
  .pin { width: 22px; height: 22px; flex: none; }
  .ctrl {
    position: absolute; top: 12px; right: 12px;
    display: flex; gap: 8px;
  }
  .chip {
    appearance: none; border: 0; cursor: pointer;
    min-height: 44px; min-width: 44px; padding: 0 14px;
    border-radius: 999px;
    background: rgba(11,34,51,.55);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: #fff; font: 700 13px/1 var(--body);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .chip:focus-visible, .cta:focus-visible, .lang a:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .chip svg { width: 18px; height: 18px; }
  .video-cta {
    position: absolute; left: 16px; right: 16px; bottom: max(18px, env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: center;
  }
  #tap {
    position: absolute; inset: 0; display: grid; place-items: center; background: rgba(11,34,51,.35);
  }
  #tap[hidden] { display: none; }
  #tap .chip { min-height: 72px; padding: 0 28px; font-size: 16px; background: var(--orange); color: var(--wa-ink); }

  /* ---------- CTA WhatsApp ---------- */
  .cta {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 56px; padding: 0 28px; border-radius: 999px;
    background: var(--orange); color: var(--wa-ink);
    font: 800 16px/1 var(--display); letter-spacing: .08em; text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 8px 24px rgba(245,138,31,.35);
  }
  .cta:active { background: var(--orange-press); transform: translateY(1px); }
  .cta svg { width: 24px; height: 24px; flex: none; }
  .video-cta .cta { min-height: 52px; font-size: 14px; }

  /* ---------- Capa 2: pantalla final (igual a la página de Canva) ---------- */
  #finalOLD {
    opacity: 0; visibility: hidden; transition: opacity .7s ease, visibility 0s linear .7s;
    display: flex; flex-direction: column; background: var(--panel);
  }
  #app.done #final { opacity: 1; visibility: visible; transition-delay: 0s; }
  .hero {
    flex: 0 0 60%; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    text-align: center; padding: 20px;
    background: linear-gradient(rgba(8,24,38,.38), rgba(8,24,38,.55)), url(hero.jpg) 34% 50% / cover no-repeat;
  }
  .hero .logo { width: min(70%, 290px); height: auto; filter: drop-shadow(0 2px 14px rgba(0,0,0,.4)); }
  .slogan {
    margin: 0; font: 700 clamp(15px, 4.6vw, 19px)/1.25 var(--display);
    letter-spacing: .12em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.5);
  }
  .panel {
    flex: 1; min-height: 0; background: var(--panel);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    text-align: center; padding: 18px 24px max(18px, env(safe-area-inset-bottom, 0px));
  }
  .panel p { margin: 0; }
  .l1 { font: 400 clamp(20px, 6vw, 26px)/1.2 var(--body); }
  .l2 { font: 800 clamp(20px, 6vw, 26px)/1.2 var(--display); }
  .l4 { font-size: 13px; line-height: 1.4; opacity: .75; max-width: 34ch; text-wrap: balance; }
  .l3 { font-size: 14px; line-height: 1.45; opacity: .92; max-width: 32ch; text-wrap: balance; }
  .lang { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
  .lang button {
    appearance: none; cursor: pointer; min-height: 44px; padding: 0 10px; border-radius: 999px;
    background: transparent; border: 1.5px solid rgba(245,236,224,.45); color: var(--sand);
    font: 700 13px var(--body); letter-spacing: 0;
  }
  .lang button[aria-pressed="true"] { background: var(--orange); border-color: var(--orange); color: var(--wa-ink); }
  html[lang^="ja"] .slogan, html[lang^="zh"] .slogan { letter-spacing: .04em; }
  .lang button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .replay { background: transparent; border: 0; color: var(--sand); opacity: .7; font: 600 13px var(--body); min-height: 44px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .brand-logo { position: absolute; top: 12px; left: 14px; width: 92px; height: auto; filter: drop-shadow(0 1px 6px rgba(0,0,0,.55)); }

  @media (prefers-reduced-motion: reduce) { #final { transition: none; } }

  /* ---------- Hub (pantalla final nueva) ---------- */
  #final{opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s;display:block;background:#0D1B2A;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #app.done #final{opacity:1;visibility:visible;transition-delay:0s}
  .hhero{position:relative;padding:22px 20px 26px;text-align:center;background:linear-gradient(rgba(13,27,42,.45),rgba(13,27,42,.92)),url(/rioia/hero.jpg) 40% 35%/cover no-repeat}
  .hhero .logo{width:150px;height:auto;filter:drop-shadow(0 2px 12px rgba(0,0,0,.45))}
  .hhero .slogan{margin:6px 0 14px;font:700 12px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase;color:#F4B400}
  .hhero h1{margin:0;font:800 clamp(26px,7.4vw,32px)/1.08 var(--display);color:#fff}
  .hhero h1 em{font-style:normal;color:#4DD0C8}
  .hhero .sub{margin:10px auto 0;max-width:34ch;font-size:15px;line-height:1.45;color:#E7ECF0}
  .need{padding:20px 16px 8px}
  .need h2{margin:0 0 12px;font:800 18px var(--display);color:#fff}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{appearance:none;border:1px solid rgba(77,208,200,.25);background:#13283D;color:#fff;border-radius:16px;min-height:76px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;text-align:left;cursor:pointer;font:700 15px/1.15 var(--display)}
  .tile .ic{font-size:22px;line-height:1}
  .tile small{font:600 11.5px/1.25 var(--body);color:#9FB2C3}
  .tile:active{transform:scale(.98)}
  .tile.help{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px;background:#0F3A44;border-color:#00B4A6}
  .foot{padding:18px 16px 110px;text-align:center}
  .foot .lang{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .lang button{appearance:none;cursor:pointer;min-height:40px;padding:0 10px;border-radius:999px;background:transparent;border:1.5px solid rgba(245,236,224,.35);color:var(--sand);font:700 12px var(--body)}
  .lang button[aria-pressed="true"]{background:#00B4A6;border-color:#00B4A6;color:#0D1B2A}
  .replay{background:transparent;border:0;color:var(--sand);opacity:.65;font:600 13px var(--body);min-height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-top:6px}
  .human{position:absolute;left:0;right:0;bottom:0;padding:10px 14px max(12px,env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,#0D1B2A 70%,rgba(13,27,42,0));z-index:5}
  .human a{display:flex;align-items:center;gap:12px;background:#00B4A6;color:#0D1B2A;text-decoration:none;border-radius:18px;padding:11px 16px;box-shadow:0 8px 24px rgba(0,180,166,.3)}
  .human a svg{width:28px;height:28px;flex:none}
  .human b{display:block;font:800 15px/1.1 var(--display)}
  .human small{display:block;font:600 12px/1.25 var(--body);opacity:.85}
  #app:not(.done) .human{display:none}
  /* sheet */
  .sheet{position:absolute;inset:0;background:#0D1B2A;z-index:8;transform:translateY(100%);transition:transform .35s ease;overflow-y:auto;padding:0 16px 120px}
  .sheet.open{transform:none}
  .sheet .bar{position:sticky;top:0;background:#0D1B2A;display:flex;align-items:center;gap:10px;padding:14px 0 10px;z-index:2}
  .sheet .back{appearance:none;border:1px solid #2A4058;background:#13283D;color:#fff;border-radius:999px;min-height:40px;padding:0 14px;font:700 13px var(--body);cursor:pointer}
  .sheet h3{margin:4px 0 6px;font:800 24px/1.1 var(--display);color:#fff}
  .sheet .intro{margin:0 0 14px;color:#C9D3DC;font-size:14.5px;line-height:1.45}
  .xp{display:block;background:#13283D;border-radius:16px;overflow:hidden;text-decoration:none;color:#fff;margin-bottom:12px}
  .xp img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0A1622}
  .xp .t{padding:12px 14px 14px}
  .xp b{display:block;font:800 16px/1.2 var(--display)}
  .xp .pr{display:block;margin-top:4px;font-size:13px;color:#F4B400;font-weight:700}
  .xp .go{display:block;margin-top:6px;font-size:13px;color:#4DD0C8;font-weight:700}
  .qh{margin:18px 0 8px;font:700 13px var(--body);color:#9FB2C3;text-transform:uppercase;letter-spacing:.08em}
  .q{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#13283D;border:1px solid rgba(77,208,200,.3);color:#fff;text-decoration:none;border-radius:14px;padding:13px 14px;margin-bottom:8px;font:700 14.5px/1.3 var(--body)}
  .q span:last-child{color:#4DD0C8;flex:none}
</style>

  // FR/DE/JA/ZH: el hub usa inglés (video y textos generales siguen en su idioma)
  function HL(l){ return H[l] || H.en; }

  function waMsg(l, m){
    var t = m || MSG[l];

  }
  function esc(x){ return String(x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  var sheet, curCat = null;
  function renderHub(l){
    var h = HL(l);
    document.getElementById("hTitle").innerHTML = esc(h.t1) + "<br><em>" + esc(h.t2) + "</em>";
    document.querySelectorAll("[data-h]").forEach(function(el){ el.textContent = h[el.getAttribute("data-h")]; });
    document.getElementById("tiles").innerHTML = CATS.map(function(c){
      var n = h.c[c.k];
      if (c.k === "help") return '<button class="tile help" data-k="help"><span class="ic">'+c.ic+'</span><span>'+esc(n[0])+'<br><small>'+esc(n[1])+'</small></span></button>';
      return '<button class="tile" data-k="'+c.k+'"><span class="ic">'+c.ic+'</span>'+esc(n[0])+'<small>'+esc(n[1])+'</small></button>';
    }).join("");

  function fillSheet(k){

    }).join("");
    document.getElementById("sQ").innerHTML = h.q[k].map(function(q){

    document.querySelectorAll("#sQ .wa-q").forEach(function(a){ a.addEventListener("click", function(){ logEvent("wa_click"); }); });
  }
  function openCat(k){ curCat = k; fillSheet(k); sheet.classList.add("open"); sheet.scrollTop = 0; logEvent("cat_"+k); }
  function closeCat(){ curCat = null; sheet.classList.remove("open"); }

  function applyLang(l) {
    lang = l;
    document.documentElement.lang = HTML_LANG[l];
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = T[l][el.getAttribute("data-i18n")]; });
    document.querySelectorAll("a.wa").forEach(function (a) { a.href = waLink(l); });
    document.querySelectorAll("#lang button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.l === l ? "true" : "false"); });
    syncSound();
    renderHub(l);
  }
  document.querySelectorAll("#lang button").forEach(function (b) {
    b.addEventListener("click", function () { applyLang(b.dataset.l); });

  // ===== Flujo video -> pantalla final =====
  var app = document.getElementById("app");
  var v = document.getElementById("video");
  var tap = document.getElementById("tap");
  var soundBtn = document.getElementById("sound");
  var soundTxt = document.getElementById("soundTxt");
  var wave = document.getElementById("wave");

  var startTimer;
  function finish() { app.classList.add("done"); try { v.pause(); } catch (e) {} }
  function start() {
    app.classList.remove("done");
    var p;
    try { v.currentTime = 0; p = v.play(); } catch (e) {}
    // Si en 8 s el video no arrancó (conexión lenta o bloqueo), pasamos a la pantalla final con el botón.
    clearTimeout(startTimer);
    startTimer = setTimeout(function () { if (!app.classList.contains("done") && v.currentTime < 0.5) finish(); }, 8000);
    if (p && p.then) {
      p.then(function () { tap.hidden = true; }).catch(function () { tap.hidden = false; });
    }
  }
  function syncSound() {
    soundTxt.textContent = v.muted ? T[lang].sound : T[lang].mute;
    soundBtn.setAttribute("aria-label", v.muted ? T[lang].sound : T[lang].mute);
    wave.style.display = v.muted ? "none" : "";
  }

  v.addEventListener("ended", finish);
  v.addEventListener("error", finish);
  document.getElementById("skip").addEventListener("click", finish);
  document.getElementById("replay").addEventListener("click", start);
  document.getElementById("tapBtn").addEventListener("click", function () { v.muted = false; syncSound(); start(); });
  soundBtn.addEventListener("click", function () {
    v.muted = !v.muted; syncSound();
    if (v.paused && !app.classList.contains("done")) { try { v.play(); } catch (e) {} }
  });
  // Si el video no avanza (conexión lenta o bloqueo), no dejamos al turista esperando.
  var lastT = -1, stuck = 0;
  setInterval(function () {
    if (app.classList.contains("done") || !tap.hidden) return;
    if (v.currentTime === lastT) { stuck++; } else { stuck = 0; lastT = v.currentTime; }
    if (stuck >= 8) finish();
  }, 1000);

  v.addEventListener("ended", function () { logEvent("video_end"); });
  document.getElementById("skip").addEventListener("click", function () { logEvent("skip"); });
  document.querySelectorAll("a.wa").forEach(function (a) { a.addEventListener("click", function () { logEvent("wa_click"); }); });
  try { if (!sessionStorage.getItem("rioia_scan")) { sessionStorage.setItem("rioia_scan", "1"); logEvent("scan"); } } catch (e) { logEvent("scan"); }

  sheet = document.getElementById("sheet");
  document.getElementById("back").addEventListener("click", closeCat);
  applyLang(lang);
  start();
})();
